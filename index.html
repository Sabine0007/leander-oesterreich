<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Leanders Österreich-Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: eine schmale Spalte fürs Handy; die Karte ist der Star, darunter Frage + große Knöpfe */
:root{
  --bg:#EEF3EE; --card:#FFFFFF; --ink:#1D332E; --muted:#5E716B; --line:#D3DDD6;
  --red:#C8102E; --red-soft:#FBE3E6; --ok:#1F8A5B; --ok-soft:#DDF3E8; --bad:#C8402F; --bad-soft:#FBE3DF;
  --sun:#FFC93C; --nb:#E4E0D6; --nb-line:#BDB6A6; --st-line:#FFFFFF; --water:#D6E6F0;
  --s1:#9ED2B5; --s2:#F6C28B; --s3:#B9C8F0; --s4:#F3A9A4; --s5:#C9E28F; --s6:#E7B6E0; --s7:#8FD3D8; --s8:#F4DD7C; --s9:#D2B48C;
  --hi:#C8102E; --f-display:"Fredoka","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13201D; --card:#1D2E2A; --ink:#E7F0EC; --muted:#9DB2AA; --line:#2E443E;
  --red:#FF6B7F; --red-soft:#4A1D25; --ok:#4CC38A; --ok-soft:#163A2B; --bad:#FF7A66; --bad-soft:#4A221C;
  --nb:#2C3A36; --nb-line:#44564F; --st-line:#13201D; --water:#1B3340;
  --s1:#3F8E68; --s2:#B07A3E; --s3:#5568A8; --s4:#A8534D; --s5:#78963A; --s6:#9A5C92; --s7:#3B8E93; --s8:#A99130; --s9:#8C6E46; --hi:#FF6B7F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13201D; --card:#1D2E2A; --ink:#E7F0EC; --muted:#9DB2AA; --line:#2E443E;
  --red:#FF6B7F; --red-soft:#4A1D25; --ok:#4CC38A; --ok-soft:#163A2B; --bad:#FF7A66; --bad-soft:#4A221C;
  --nb:#2C3A36; --nb-line:#44564F; --st-line:#13201D; --water:#1B3340;
  --s1:#3F8E68; --s2:#B07A3E; --s3:#5568A8; --s4:#A8534D; --s5:#78963A; --s6:#9A5C92; --s7:#3B8E93; --s8:#A99130; --s9:#8C6E46; --hi:#FF6B7F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding:16px 16px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:600;text-wrap:balance}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 16px;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn-main{background:var(--red);border-color:var(--red);color:#fff;font-size:18px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tnum{font-variant-numeric:tabular-nums}

/* Kopf */
.top{display:flex;align-items:center;gap:12px}
.flag{width:46px;height:30px;border-radius:5px;flex:none;background:linear-gradient(var(--red) 0 33.3%,#fff 33.3% 66.6%,var(--red) 66.6%);border:1px solid var(--line)}
.top h1{font-size:26px;line-height:1.1}
.top .sub{font-size:14px;color:var(--muted)}

/* Karte */
.mapbox{padding:8px;overflow:hidden}
svg.map{display:block;width:100%;height:auto;background:var(--water);border-radius:12px;user-select:none;-webkit-user-select:none}
svg.map .nb{fill:var(--nb);stroke:var(--nb-line);stroke-width:1;stroke-linejoin:round}
svg.map .st{stroke:var(--st-line);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s,opacity .2s}
svg.map.quiz .st{fill:var(--s1)}
svg.map.quiz.plain .st{fill:#CFE3D6}
svg.map .clickable{cursor:pointer}
svg.map .is-hi{fill:var(--hi)!important;stroke:#fff}
svg.map .is-ok{fill:var(--ok)!important}
svg.map .is-bad{fill:var(--bad)!important}
svg.map .is-dim{opacity:.35}
svg.map .lbl{font-family:var(--f-display);font-weight:600;font-size:17px;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
svg.map .lbl.nbl{font-size:16px;fill:var(--muted);font-style:italic}
svg.map .cap{fill:#fff;stroke:var(--ink);stroke-width:2}
svg.map .cap.is-hi{fill:var(--sun)!important;stroke:var(--ink);stroke-width:2.5}
svg.map .capl{font-size:14px;font-weight:500}
svg.map .hit{fill:transparent;cursor:pointer}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-weight:700}

/* Stationen */
.stations{display:grid;gap:10px}
.station{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);padding:14px}
.station .ico{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:26px;background:var(--bg)}
.station b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600}
.station .s{font-size:14px;color:var(--muted);font-weight:400}
.station .stars{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap;font-weight:700}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok);transition:width .3s}

/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qbar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--red);transition:width .3s}
.prompt{font-family:var(--f-display);font-size:24px;font-weight:600;text-align:center;line-height:1.2;text-wrap:balance}
.prompt em{font-style:normal;color:var(--red)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{min-height:58px;font-size:17px}
.opts button.ok{background:var(--ok-soft);border-color:var(--ok)}
.opts button.bad{background:var(--bad-soft);border-color:var(--bad)}
.answer{width:100%;font:inherit;font-size:22px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.answer.ok{border-color:var(--ok);background:var(--ok-soft)}
.answer.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:14px;padding:12px 14px;font-size:16px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{font-family:var(--f-display);font-size:19px}
.tip{font-size:14px;color:var(--muted);text-align:center}

/* Info-Karte im Entdecken */
.info h2{font-size:24px}
.info .cap-name{font-size:18px;margin-top:2px}
.info .fact{margin-top:8px;font-size:15px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:14px;margin:2px 4px 2px 0}

/* Ergebnis */
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.big{font-family:var(--f-display);font-size:56px;line-height:1;font-weight:600}
.ampel{display:flex;gap:8px}
.ampel i{width:26px;height:26px;border-radius:50%;background:var(--line)}
.ampel i.r.on{background:#E04A3A}.ampel i.y.on{background:var(--sun)}.ampel i.g.on{background:var(--ok)}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);border-radius:10px;padding:4px 14px;font-family:var(--f-display);font-weight:600;font-size:22px;transform:rotate(-4deg)}
table.list{width:100%;border-collapse:collapse;font-size:15px}
table.list td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.list tr:last-child td{border:0}
table.list td:first-child{font-weight:700}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:400;text-decoration:underline;font-size:14px}
</style>
</head><body>

function qWriteState(n){return {kind:"write",key:["w",n],prompt:"Wie heißt das <em>rote</em> Bundesland?",hiSt:n,ans:n};}
function qWriteNb(n){return {kind:"write",key:null,prompt:"Wie heißt das <em>rote</em> Nachbarland?",hiNb:n,ans:n};}

function prio(obj,list,n){var a=shuffle(list.filter(function(x){return !obj[x];})),b=shuffle(list.filter(function(x){return obj[x];}));return a.concat(b).slice(0,n);}
function buildRound(mode){
  var qs=[];
  if(mode==="st")prio(S.st,SN,8).forEach(function(n,i){qs.push(i%2?qNameState(n):qFindState(n));});
  if(mode==="cap")prio(S.cap,SN,8).forEach(function(n,i){qs.push(i%2?qStateOfCap(n):qCapOf(n));});
  if(mode==="nb")prio(S.nb,NN,8).forEach(function(n,i){qs.push(i%2?qNameNb(n):qFindNb(n));});
  if(mode==="w")prio(S.w,SN,6).forEach(function(n,i){qs.push(i%2?qWriteState(n):qWriteCap(n));});
  if(mode==="test"){
    shuffle(SN).slice(0,4).forEach(function(n,i){qs.push(i%2?qNameState(n):qFindState(n));});
    shuffle(SN).slice(0,4).forEach(function(n,i){qs.push(i%2?qStateOfCap(n):qCapOf(n));});
    shuffle(NN).slice(0,4).forEach(function(n,i){qs.push(i%2?qNameNb(n):qFindNb(n));});
    shuffle(SN).slice(0,2).forEach(function(n){qs.push(qWriteCap(n));});
    qs.push(qWriteNb(shuffle(NN.filter(function(x){return x!=="Liechtenstein";}))[0]));
    qs=shuffle(qs);
  }
  return qs;
}
var TITLES={st:"Bundesländer",cap:"Hauptstädte",nb:"Nachbarländer",w:"Profi: Schreiben",test:"Großer Test"};

/* ---------- Quiz ---------- */
function startRound(mode){
  var qs=buildRound(mode),i=0,right=0,firstTry=true,total=qs.length,isTest=mode==="test";
  var wrongs=[];
  function show(){
    var q=qs[i];firstTry=true;window.scrollTo(0,0);
    app.textContent="";
    app.appendChild(backBar(TITLES[mode],h("span",{"class":"small muted tnum",text:Math.min(i+1,qs.length)+"/"+qs.length})));
    app.appendChild(h("div",{"class":"qbar"},[h("i",{style:"width:"+Math.round(i/qs.length*100)+"%"})]));
    app.appendChild(h("div",{"class":"prompt",html:q.prompt}));
    var mb=h("div",{"class":"card mapbox"});app.appendChild(mb);
    var area=h("div");app.appendChild(area);
    var fb=h("div");app.appendChild(fb);
    var locked=false;
    var ref=makeMap({quiz:true,plain:true,caps:!!q.hiCap,nbLabels:q.kind==="tapSt"||mode==="st",
      onState:q.kind==="tapSt"?function(n){answer(n);}:null,onNb:q.kind==="tapNb"?function(n){answer(n);}:null});
    mb.appendChild(ref.svg);
    if(q.hiSt)setCls(ref.st[q.hiSt],"is-hi");
    if(q.hiNb)setCls(ref.nb[q.hiNb],"is-hi");
    if(q.hiCap)setCls(ref.cap[q.hiCap],"is-hi");
    if(q.kind==="opt"){
      var box=h("div",{"class":"opts"});
      q.opts.forEach(function(o){var b=h("button",{text:o,onclick:function(){if(locked)return;var ok=o===q.ans;b.classList.add(ok?"ok":"bad");if(!ok)[].forEach.call(box.children,function(x){if(x.textContent===q.ans)x.classList.add("ok");});answer(o);}});box.appendChild(b);});
      area.appendChild(box);
    }
    if(q.kind==="tapSt"||q.kind==="tapNb")area.appendChild(h("div",{"class":"tip",text:q.kind==="tapSt"?"Tipp direkt auf die Karte.":"Tipp auf das Land rund um Österreich."}));
    if(q.kind==="write"){
      var inp=h("input",{"class":"answer",type:"text",autocomplete:"off",autocapitalize:"words",spellcheck:"false",placeholder:"hier schreiben"});
      var go=h("button",{"class":"btn-main",text:"Prüfen",onclick:function(){if(locked)return;if(!inp.value.trim()){inp.focus();return;}var ok=norm(inp.value)===norm(q.ans);inp.classList.add(ok?"ok":"bad");answer(ok?q.ans:inp.value.trim());}});
      inp.addEventListener("keydown",function(e){if(e.key==="Enter")go.click();});
      area.appendChild(h("div",{style:"display:flex;flex-direction:column;gap:10px"},[inp,go]));
      setTimeout(function(){inp.focus();},50);
    }
    function answer(a){
      if(locked)return;locked=true;
      var ok=(q.kind==="write")?norm(a)===norm(q.ans):a===q.ans;
      if(q.kind==="tapSt"){setCls(ref.st[a],ok?"is-ok":"is-bad");if(!ok)setCls(ref.st[q.ans],"is-ok");}
      if(q.kind==="tapNb"){setCls(ref.nb[a],ok?"is-ok":"is-bad");if(!ok)setCls(ref.nb[q.ans],"is-ok");}
      if(ok){right++;if(q.key){S[q.key[0]][q.key[1]]=1;save();}}
      else wrongs.push(q);
      fb.textContent="";
      var txt;
      if(ok)txt=h("div",{"class":"fb ok"},[h("b",{text:"✓ "+PRAISE[Math.floor(Math.random()*PRAISE.length)]}),q.why?h("div",{"class":"small",text:"💡 "+q.why}):null]);
      else txt=h("div",{"class":"fb bad"},[h("b",{text:"Fast! Richtig ist: "+q.ans}),(q.kind==="tapSt"||q.kind==="tapNb")?h("div",{"class":"small",text:"Du hast "+a+" getippt. Das grüne ist "+q.ans+"."}):(q.kind==="write"?h("div",{"class":"small",text:"Du hast geschrieben: „"+a+"“"}):null),q.why?h("div",{"class":"small",text:"💡 "+q.why}):null]);
      fb.appendChild(txt);
      if(!ok&&!isTest){qs.push(q);}// falsche Frage kommt am Ende nochmal
      var nx=h("button",{"class":"btn-main",style:"margin-top:10px",text:i+1<qs.length?"Weiter →":"Fertig",onclick:function(){i++;if(i<qs.length)show();else done();}});
      fb.appendChild(nx);nx.focus({preventScroll:true});
      fb.scrollIntoView({behavior:"smooth",block:"nearest"});
    }
  }
  function done(){
    app.textContent="";
    app.appendChild(backBar(TITLES[mode]));
    var r=h("div",{"class":"card result"});
    if(isTest){
      if(S.best==null||right>S.best)S.best=right;S.tests=(S.tests||0)+1;save();
      var lvl=right>=13?"g":right>=9?"y":"r";
      r.appendChild(h("div",{"class":"big tnum",text:right+" / "+total}));
      r.appendChild(h("div",{"class":"ampel"},[h("i",{"class":"r"+(lvl==="r"?" on":"")}),h("i",{"class":"y"+(lvl==="y"?" on":"")}),h("i",{"class":"g"+(lvl==="g"?" on":"")})]));
      r.appendChild(h("div",{text:lvl==="g"?"Du bist bereit für die Schule! 🎉":lvl==="y"?"Schon richtig gut! Noch ein bisschen üben.":"Übe die Stationen 1–3 nochmal, dann klappt's."}));
      if(right===total)r.appendChild(h("span",{"class":"stamp",text:"Österreich-Profi"}));
      if(wrongs.length){var t=h("table",{"class":"list"});wrongs.forEach(function(q){t.appendChild(h("tr",null,[h("td",{html:q.prompt.replace(/<[^>]+>/g,"")}),h("td",{text:q.ans})]));});
        r.appendChild(h("div",{style:"width:100%;text-align:left;margin-top:8px"},[h("b",{text:"Das schauen wir uns nochmal an:"}),t]));}
    }else{
      r.appendChild(h("div",{"class":"big",text:"⭐"}));
      r.appendChild(h("h2",{text:"Runde geschafft!"}));
      var list=mode==="nb"?NN:SN,got=count(S[mode],list);
      r.appendChild(h("div",{"class":"tnum",text:got+" von "+list.length+" Sternen in „"+TITLES[mode]+"“"}));
      if(got===list.length)r.appendChild(h("span",{"class":"stamp",text:"Alles gesammelt!"}));
    }
    app.appendChild(r);
    app.appendChild(h("button",{"class":"btn-main",text:isTest?"Nochmal testen":"Noch eine Runde",onclick:function(){startRound(mode);}}));
    app.appendChild(h("button",{text:"Zur Karte",onclick:home}));
    window.scrollTo(0,0);
  }
  show();
}

/* ---------- Spickzettel ---------- */
function cheat(){window.scrollTo(0,0);
  app.textContent="";
  app.appendChild(backBar("Spickzettel"));
  var mb=h("div",{"class":"card mapbox"});mb.appendChild(makeMap({labels:true,nbLabels:true,caps:true,capLabels:true}).svg);app.appendChild(mb);
  var t=h("table",{"class":"list"});
  STATES.forEach(function(s){t.appendChild(h("tr",null,[h("td",{text:s.n}),h("td",{text:s.c})]));});
  app.appendChild(h("div",{"class":"card"},[h("h2",{text:"Bundesland · Hauptstadt",style:"font-size:20px;margin-bottom:6px"}),t]));
  var n=h("div");NBS.forEach(function(x){n.appendChild(h("span",{"class":"pill",text:x.n}));});
  app.appendChild(h("div",{"class":"card"},[h("h2",{text:"Die 8 Nachbarländer",style:"font-size:20px;margin-bottom:6px"}),n,
    h("div",{"class":"small muted",style:"margin-top:8px",text:"Im Uhrzeigersinn von oben: Deutschland, Tschechien, Slowakei, Ungarn, Slowenien, Italien, Schweiz, Liechtenstein."})]));
  app.appendChild(h("div",{style:"text-align:center"},[h("button",{"class":"link",text:"Alle Sterne löschen",onclick:function(){if(confirm("Wirklich alle Sterne löschen?")){S={st:{},cap:{},nb:{},w:{},best:null,tests:0};save();home();}}})]));
}

home();
})();
</script>
